# === data sourcing
# 1. python-rest-api
# === hadoop map reduce with yarn
# 2. hdfs-namenode
# 3. hdfs-datanode
# 4. yarn-resourcemanager
# 5. yarn-nodemanager
# === spark pyspark jupyter notebook
# 6. spark-jupyter
# === postgres pgadmin4
# 7. postgres
# 8. pgadmin4
# === clickhouse
# 9. clickhouse
# === airflow
# 10. redis
# 11. airflow-apiserver
# 12. airflow-scheduler
# 13. airflow-dag-processor
# 14. airflow-worker
# 15. airflow-triggerer
# 16. airflow-init
